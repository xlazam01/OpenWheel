; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:STM32G0B1]
platform = ststm32
board = nucleo_g0b1re
framework = arduino
upload_protocol = dfu
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    ; pid.codes VID 0x1209. PID 0x0001 is the shared TEST pid. The planned OpenWheel PID is
    ; 0x2180 (see docs/USB_IDS.md): switch to it once the pid.codes pull request is merged.
    -D USBD_VID=0x1209
    -D USBD_PID=0x0001
    -D USB_MANUFACTURER_STRING="\"OpenWheel\""
    -D USB_PRODUCT_STRING="\"OpenWheel Filter Wheel\""
    -D HAL_PCD_MODULE_ENABLED
lib_deps =
    TMCStepper
    ExternalEEPROM